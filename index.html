<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>README Studio</title>
<meta name="description" content="Visual README builder — drag blocks, edit everything, export clean GitHub markdown.">
<meta name="theme-color" content="#ECEEFF">
<meta property="og:title" content="README Studio">
<meta property="og:description" content="Visual block editor for GitHub profile READMEs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ═══ TOOLBAR ═══════════════════════════════════════════════ -->
<div class="toolbar">
  <div class="tb-logo">
    <img src="public/brand/mark.svg" alt="" width="28" height="28" onerror="this.style.display='none'">
    <span>README Studio</span>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-mid">
    <button class="tab-pill active" data-view="canvas" id="view-canvas">Canvas</button>
    <button class="tab-pill" data-view="markdown" id="view-markdown">Markdown</button>
  </div>
  <div class="tb-right">
    <a href="https://github.com/takemygunq/readme-studio" target="_blank" class="btn-ghost">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
      GitHub
    </a>
    <button class="btn-ghost" id="btn-dl">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      .md
    </button>
    <button class="btn-primary" id="btn-copy">Copy Markdown</button>
  </div>
</div>

<!-- ═══ APP SHELL ════════════════════════════════════════════ -->
<div class="app-shell">

  <!-- ── LEFT: Block Library ──────────────────────────────── -->
  <aside class="lib-panel">
    <div class="lib-search">
      <div class="lib-search-wrap">
        <span class="lib-search-icon">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </span>
        <input type="text" class="lib-search-input" id="lib-search" placeholder="Search blocks…">
      </div>
    </div>
    <div class="lib-cats" id="lib-cats"></div>
    <div class="lib-body" id="lib-body"></div>
  </aside>

  <!-- ── CENTER: Canvas ──────────────────────────────────── -->
  <div class="canvas-wrap">
    <div class="canvas-bar">
      <div class="canvas-dots">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
      </div>
      <div class="canvas-bar-url">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        github.com/&lt;your-username&gt;/&lt;your-username&gt;
      </div>
    </div>

    <div class="canvas-scroll" id="canvas-scroll">
      <div class="canvas-frame" id="canvas-frame">
        <div id="canvas-blocks"></div>
        <div class="canvas-empty" id="canvas-empty">
          <div class="canvas-empty-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          </div>
          <div class="canvas-empty-title">Your README canvas is empty</div>
          <div class="canvas-empty-sub">Drag blocks from the left panel<br>or click any block to add it</div>
        </div>
      </div>
    </div>

    <!-- Markdown view (hidden by default) -->
    <pre id="md-view"></pre>
  </div>

  <!-- ── RIGHT: Properties Panel ─────────────────────────── -->
  <aside class="props-panel">
    <div class="props-header">
      <span class="props-title" id="props-title">Properties</span>
      <span class="props-type" id="props-type"></span>
    </div>
    <div class="props-empty" id="props-empty">
      <div class="props-empty-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      </div>
      <div style="font-size:12px;color:var(--text-3)">Select a block<br>to edit its properties</div>
    </div>
    <div class="props-body" id="props-body" style="display:none"></div>
  </aside>

</div><!-- /app-shell -->

<script src="js/icons-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
